<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Secondary visual break placeholder</title>
  <desc id="desc">Replace this file with your secondary visual break photo.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e5d5"/>
      <stop offset="45%" stop-color="#caa06a"/>
      <stop offset="100%" stop-color="#32443c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="70" y="70" width="1460" height="760" rx="28" fill="none" stroke="#19231f" stroke-opacity=".24" stroke-width="4"/>
  <text x="800" y="420" fill="#19231f" font-family="Arial, sans-serif" font-size="64" text-anchor="middle">Visual Break Secondary</text>
  <text x="800" y="500" fill="#19231f" font-family="Arial, sans-serif" font-size="30" text-anchor="middle">Replace in public/images/visual-breaks</text>
</svg>
