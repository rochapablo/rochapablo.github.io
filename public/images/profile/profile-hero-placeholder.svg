<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Hero profile placeholder</title>
  <desc id="desc">Replace this file with your hero portrait image.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24342d"/>
      <stop offset="100%" stop-color="#c08d59"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <rect x="90" y="90" width="1020" height="1320" rx="36" fill="none" stroke="#f6efe3" stroke-opacity=".34" stroke-width="4"/>
  <text x="600" y="700" fill="#f6efe3" font-family="Arial, sans-serif" font-size="72" text-anchor="middle">Hero Portrait</text>
  <text x="600" y="790" fill="#f6efe3" font-family="Arial, sans-serif" font-size="34" text-anchor="middle">Replace in public/images/profile</text>
</svg>
