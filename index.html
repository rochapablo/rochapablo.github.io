<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <link rel="canonical" href="">
  <title></title>
  <link rel="stylesheet" href="./dist/css/styles.css">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="bad2c57a-f1a1-475e-9977-015f6af0204f"></script>
  <script defer src="./public/vendor/progressbar.min.js"></script>
  <script id="profile-structured-data" type="application/ld+json"></script>
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="#top" aria-label="" data-brand-link>
        <span class="brand__mark" aria-hidden="true" data-brand-mark></span>
        <span class="brand__name" data-profile-name></span>
      </a>
      <button
        class="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="site-nav"
        aria-label=""
        data-nav-toggle
        data-nav-toggle-label
      ></button>
      <nav id="site-nav" class="site-nav" aria-label="" data-site-nav>
        <div class="site-nav__links" data-nav-links></div>
        <a class="site-nav__resume" data-nav-resume></a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero section">
      <div class="container hero__grid">
        <div class="hero__content">
          <p class="eyebrow" data-page-heading="hero-greeting"></p>
          <h1 data-page-heading="hero-name"></h1>
          <p class="hero__title" data-page-heading="hero-title"></p>
          <p class="hero__tagline" data-profile-tagline></p>
          <p class="hero__summary" data-profile-summary></p>
          <div class="hero__actions" aria-label="" data-primary-actions></div>
        </div>
        <div class="hero__media">
          <div class="media-slot media-slot--portrait media-slot--offset" aria-hidden="true" data-image-slot="heroPortrait"></div>
        </div>
      </div>
    </section>

    <section id="about" class="section section-surface">
      <div class="container snapshot">
        <div class="snapshot__headline">
          <p class="section-kicker" data-page-heading="about-kicker"></p>
          <h2 data-page-heading="about-title"></h2>
        </div>
        <div class="snapshot__content">
          <p class="snapshot__text" data-profile-snapshot></p>
          <div class="facts-list" aria-label="" data-profile-facts></div>
        </div>
      </div>
    </section>

    <section id="strengths" class="section">
      <div class="container strengths">
        <div class="section-heading">
          <p class="section-kicker" data-page-heading="strengths-kicker"></p>
          <h2 data-page-heading="strengths-title"></h2>
        </div>
        <div id="strengths-list" class="strengths__grid" aria-label=""></div>
      </div>
    </section>

    <section class="visual-break" aria-hidden="true">
      <div class="visual-break__frame">
        <div class="visual-break__inner" data-image-slot="visualBreakPrimary"></div>
      </div>
    </section>

    <section id="skills" class="section section-inverse">
      <div class="container skills-section">
        <div class="skills-section__intro">
          <p class="section-kicker" data-page-heading="skills-kicker"></p>
          <h2 data-page-heading="skills-title"></h2>
        </div>
        <div class="skills-section__panel">
          <div class="skills-section__sidebar">
            <p class="skills-section__support" data-page-heading="skills-support"></p>
          </div>
          <div class="skills-section__content">
            <div class="skills-tabs" role="tablist" aria-label="" data-skills-tabs></div>
            <div class="skills-list" aria-live="polite" data-skills-panel></div>
          </div>
        </div>
      </div>
    </section>

    <section id="experience" class="section">
      <div class="container experience-section">
        <div class="section-heading">
          <p class="section-kicker" data-page-heading="experience-kicker"></p>
          <h2 data-page-heading="experience-title"></h2>
        </div>
        <div id="experience-list" class="experience-timeline"></div>
      </div>
    </section>

    <section class="visual-break visual-break--secondary" aria-hidden="true">
      <div class="visual-break__frame">
        <div class="visual-break__inner" data-image-slot="visualBreakSecondary"></div>
      </div>
    </section>

    <section class="section section-surface">
      <div class="container personal-note">
        <div class="personal-note__content">
          <p class="section-kicker" data-page-heading="personal-note-kicker"></p>
          <h2 data-page-heading="personal-note-title" data-personal-note-title></h2>
          <p class="personal-note__text" data-personal-note-text></p>
        </div>
        <div class="personal-note__media" aria-hidden="true">
          <div class="media-slot media-slot--landscape" data-image-slot="workspaceDesk"></div>
          <div class="personal-note__media-grid">
            <div class="media-slot media-slot--small" data-image-slot="personalLifePrimary"></div>
            <div class="media-slot media-slot--small" data-image-slot="personalLifeSecondary"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section career-direction">
      <div class="container career-direction__inner">
        <p class="section-kicker" data-page-heading="career-direction-kicker"></p>
        <h2 data-page-heading="career-direction-title"></h2>
        <p class="career-direction__text" data-career-direction></p>
      </div>
    </section>

    <section id="contact" class="section closing">
      <div class="container closing__grid">
        <div class="closing__intro">
          <p class="section-kicker" data-page-heading="contact-kicker"></p>
          <h2 data-page-heading="contact-title"></h2>
        </div>
        <div id="contact-links" class="contact-links"></div>
        <div class="closing__media" aria-hidden="true">
          <div class="media-slot media-slot--closing" data-image-slot="closingProfile"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p><span data-footer-name></span> &copy; <span id="current-year"></span></p>
    </div>
  </footer>

  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
