<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Workspace placeholder</title>
  <desc id="desc">Replace this file with your workspace image.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25352e"/>
      <stop offset="100%" stop-color="#f3e6d2"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect x="90" y="90" width="1220" height="720" rx="32" fill="none" stroke="#f6efe3" stroke-opacity=".28" stroke-width="4"/>
  <text x="700" y="420" fill="#f6efe3" font-family="Arial, sans-serif" font-size="58" text-anchor="middle">Workspace Desk</text>
  <text x="700" y="495" fill="#f6efe3" font-family="Arial, sans-serif" font-size="30" text-anchor="middle">Replace in public/images/workspace</text>
</svg>
